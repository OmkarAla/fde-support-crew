[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-crew"
version = "0.1.0"
description = "Multi-agent support triage with a deterministic policy core"
requires-python = ">=3.11"
dependencies = ["crewai>=0.80"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
support-crew = "support_crew.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
